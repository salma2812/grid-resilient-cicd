name: Protected Training Job

on:
  workflow_dispatch:
    inputs:
      resume_from_checkpoint:
        description: "Resume from Member 3's last checkpoint?"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: grid-resilient-training
  cancel-in-progress: false

env:
  CHECKPOINT_SERVICE_URL: ${{ vars.CHECKPOINT_SERVICE_URL || 'http://localhost:8001' }}

jobs:
  train:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Read grid-risk state ----
      - name: Read current grid-risk state
        id: risk
        shell: python
        run: |
          import os
          import json

          state_file = ".grid-resilient/state.json"
          status = "normal"

          if os.path.exists(state_file):
              try:
                  with open(state_file, "r", encoding="utf-8") as f:
                      data = json.load(f)
                      status = data.get("status", "normal")
              except Exception:
                  status = "normal"

          print(f"Current risk status: {status}")

          github_output = os.getenv("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write(f"status={status}\n")

      # ---- Refuse unsafe fresh run ----
      - name: Refuse to start a fresh run while risk is high
        if: steps.risk.outputs.status == 'paused' && inputs.resume_from_checkpoint != 'true'
        shell: python
        run: |
          print(
              "::error::Grid risk is currently HIGH (state=paused). "
              "Refusing to start a new run. "
              "Wait for grid_risk_clear from the Orchestrator."
          )
          raise SystemExit(1)

      # ---- REAL integration with Member 3's Checkpoint Service ----
      - name: Restore last checkpoint (Member 3)
        id: restore
        if: ${{ inputs.resume_from_checkpoint == true || inputs.resume_from_checkpoint == 'true' }}
        shell: python
        env:
          CHECKPOINT_SERVICE_URL: ${{ env.CHECKPOINT_SERVICE_URL }}
        run: |
          import os
          import json
          import urllib.request
          import urllib.error
          import time

          base_url = os.environ["CHECKPOINT_SERVICE_URL"]
          url = f"{base_url}/resume"

          print(f"Calling checkpoint service at {url} ...")

          response_data = None
          http_code = 0

          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(
                      url,
                      method="POST",
                      headers={
                          "Content-Type": "application/json"
                      }
                  )

                  with urllib.request.urlopen(request, timeout=15) as response:
                      http_code = response.status
                      response_data = response.read().decode("utf-8")

                  break

              except urllib.error.HTTPError as e:
                  http_code = e.code
                  try:
                      response_data = e.read().decode("utf-8")
                  except Exception:
                      response_data = None
                  break

              except Exception as e:
                  print(f"Attempt {attempt}/3 failed: {e}")

                  if attempt < 3:
                      time.sleep(2)

          print(f"HTTP status: {http_code}")

          github_output = os.environ.get("GITHUB_OUTPUT")

          def set_outputs(resumed, checkpoint_path="", start_epoch=0):
              if github_output:
                  with open(github_output, "a", encoding="utf-8") as f:
                      f.write(f"resumed={str(resumed).lower()}\n")
                      f.write(f"checkpoint_path={checkpoint_path}\n")
                      f.write(f"start_epoch={start_epoch}\n")

          if http_code != 200 or not response_data:
              print(
                  f"::warning::Checkpoint service unreachable or returned "
                  f"{http_code}. Falling back to a fresh run (epoch 0)."
              )
              set_outputs(False)
              raise SystemExit(0)

          try:
              data = json.loads(response_data)
              print(json.dumps(data, indent=2))
          except Exception:
              print(
                  "::warning::Checkpoint service returned invalid JSON. "
                  "Falling back to a fresh run."
              )
              set_outputs(False)
              raise SystemExit(0)

          checkpoint_path = data.get("checkpoint_path")
          start_epoch = data.get("resumed_epoch", 0)

          if not checkpoint_path:
              print(
                  "::warning::Service responded 200 but no checkpoint_path "
                  "was found. Falling back to a fresh run."
              )
              set_outputs(False)
              raise SystemExit(0)

          print(
              f"Restored checkpoint: {checkpoint_path} "
              f"(epoch {start_epoch})"
          )

          set_outputs(
              True,
              checkpoint_path,
              start_epoch
          )

      # ---- Protected training/deployment job ----
      - name: Run the protected job
        shell: python
        env:
          RESUMED: ${{ steps.restore.outputs.resumed || 'false' }}
          CHECKPOINT_PATH: ${{ steps.restore.outputs.checkpoint_path }}
          START_EPOCH: ${{ steps.restore.outputs.start_epoch || '0' }}
        run: |
          import os
          import time

          resumed = os.environ.get("RESUMED", "false")
          checkpoint_path = os.environ.get("CHECKPOINT_PATH", "")
          start_epoch = os.environ.get("START_EPOCH", "0")

          if resumed == "true":
              print(
                  f"Resuming training from {checkpoint_path}, "
                  f"starting at epoch {start_epoch}"
              )
          else:
              print("Starting fresh training run from epoch 0")

          print("Training/deployment job running...")

          for i in range(1, 31):
              print(
                  f"step {i}/30 "
                  f"(epoch offset: {start_epoch})..."
              )
              time.sleep(2)

          print("Job finished normally.")